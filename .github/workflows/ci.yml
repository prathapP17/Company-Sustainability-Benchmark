# Checks every push and pull request: data rules, types, lint, unit tests and
# the production build. No secrets are used. The browser end-to-end suites,
# performance budgets and extraction evaluation run locally (they need Chrome
# or downloaded reports): see README "Commands".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
